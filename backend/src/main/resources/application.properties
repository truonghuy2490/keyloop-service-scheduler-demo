server.port=8081
spring.application.name=service-scheduler-demo

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keyloop_scheduler}
spring.datasource.username=${DB_USERNAME:scheduler_app}
spring.datasource.password=${DB_PASSWORD:local_dev_password_change_me}

# Let Flyway own schema creation and updates
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Store JDBC timestamps consistently in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON date/time serialization timezone
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,mappings,metrics,prometheus

management.endpoint.health.show-details=never

# Application information
management.info.env.enabled=true
info.app.name=Service Scheduler
info.app.description=Automotive Service Scheduler API
info.app.version=1.0.0

# Springdoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.use-fqn=true

# ==========================================
# Logging
# ==========================================

# Default logging level
logging.level.root=INFO

# Application layers
logging.level.com.keyloop.scheduler.application=INFO
logging.level.com.keyloop.scheduler.domain=WARN
logging.level.com.keyloop.scheduler.persistence=INFO
logging.level.com.keyloop.scheduler.presentation=INFO

# Spring Framework
logging.level.org.springframework=WARN

# Hibernate
logging.level.org.hibernate=WARN

# Disable SQL and bind parameter logging by default
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ==========================================
# HTTP Access Logging
# ==========================================

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# Database seeding
app.seed.enabled=false

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000