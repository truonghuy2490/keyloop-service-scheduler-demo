services:
  postgres:
    image: postgres:16
    container_name: keyloop-scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-keyloop_scheduler}
      POSTGRES_USER: ${DB_USERNAME:-scheduler_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - keyloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  keyloop_postgres_data: